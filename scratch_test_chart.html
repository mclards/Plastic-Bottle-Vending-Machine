<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="file:///d:/PROJECTS_IO/Plastic-Bottle-Vending-Machine/host/static/vendor/adminlte/css/adminlte.min.css">
  <link rel="stylesheet" href="file:///d:/PROJECTS_IO/Plastic-Bottle-Vending-Machine/host/static/vendor/fontawesome/css/all.min.css">
  <script src="file:///d:/PROJECTS_IO/Plastic-Bottle-Vending-Machine/host/static/vendor/chartjs/Chart.bundle.min.js"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
    .card-dark { background-color: #1e293b; color: #fff; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-8 d-flex flex-column mb-3 mb-lg-0">
        <div class="card card-dark flex-fill d-flex flex-column" id="card-recycling-history" style="border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.25);">
          <div class="card-header d-flex align-items-center justify-content-between" style="padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02);">
            <div class="d-flex align-items-center">
              <h3 class="card-title m-0" style="font-size: 13.5px; font-weight: 700; color: #f8fafc; letter-spacing: 0.3px;">
                <i class="fas fa-chart-bar text-success mr-1"></i> 7-Day Recycling Intake History
              </h3>
            </div>
            <div class="card-tools ml-auto">
              <span class="badge" style="font-size: 10.5px; font-weight: 600; background: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.25); padding: 3px 8px; border-radius: 4px;">
                <i class="fas fa-wine-bottle mr-1"></i>Bottles Log
              </span>
            </div>
          </div>
          <div class="card-body d-flex flex-column" style="padding: 16px 18px; flex: 1 1 auto; min-height: 0; position: relative;">
            <div class="chart-container" style="position: relative; width: 100%; height: 100%; min-height: 280px; flex: 1 1 auto;">
              <canvas id="historyChart"></canvas>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-4 d-flex flex-column">
        <div class="card card-dark flex-fill d-flex flex-column" id="card-system-resources" style="border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.25);">
          <div class="card-header d-flex align-items-center justify-content-between" style="padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02);">
            <h3 class="card-title m-0" style="font-size: 13.5px; font-weight: 700; color: #f8fafc;">
              <i class="fas fa-microchip text-primary mr-1"></i> System Resources
            </h3>
          </div>
          <div class="card-body" style="padding: 16px 18px;">
            <div style="height: 335px; background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.1); border-radius: 8px; display:flex; align-items:center; justify-content:center; color: #94a3b8; font-size: 12px;">
              System Resources Telemetry Items (~335px)
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    window.onload = function() {
      var ctx = document.getElementById('historyChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Sep 01', 'Sep 02', 'Sep 03', 'Sep 04', 'Sep 05', 'Sep 06', 'Sep 07'],
          datasets: [{
            label: 'Bottles Recycled',
            data: [0, 0, 0, 0, 0, 0, 0],
            backgroundColor: 'rgba(16, 185, 129, 0.85)',
            borderColor: '#10b981',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          legend: { display: false },
          scales: {
            yAxes: [{
              ticks: { beginAtZero: true, suggestedMax: 10, precision: 0, fontColor: '#cbd5e1' },
              gridLines: { color: 'rgba(255, 255, 255, 0.08)', zeroLineColor: 'rgba(255, 255, 255, 0.15)' }
            }],
            xAxes: [{
              ticks: { fontColor: '#cbd5e1' },
              gridLines: { display: false }
            }]
          }
        }
      });
    };
  </script>
</body>
</html>
